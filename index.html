<style>
  :root{
    --bg: #14152B;

    --surface-2: #262A52;
    --line: #33366B;
    --text: #F5F3ED;
    --muted: #9C9CBB;
    --gold: #F5B841;

    --violet: #9B7EDE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display:flex;
    justify-content:center;
    padding: 24px 12px;
  }
  .app{
    width:100%;
    max-width: 440px;
  }
  h1,h2,h3{
    font-family:'Sora', sans-serif;
    margin:0;
  }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background: var(--surface);
    border-radius: 18px;
    padding: 12px 16px;
    margin-bottom: 16px;
    border: 1px solid var(--line);
  }
  .stat{
    display:flex;
    align-items:center;
    gap:6px;
    font-size: 14px;
    font-weight:600;
  }
  .stat.hearts{color:var(--coral);}
  .stat.xp{color:var(--gold);}
  .stat.coins{color:var(--gold);}
  .stat.streak{color:var(--violet);}
  .card{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 24px;
    min-height: 380px;
    display:flex;
    flex-direction:column;
  }
  .brand{
    text-align:center;
    margin-bottom: 18px;
  }
  .brand h1{
    font-size: 26px;
    font-weight:800;
    letter-spacing: -0.02em;
  }
  .brand p{
    color: var(--muted);
    font-size: 14px;
    margin-top:6px;
  }
  .menu-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
  }
  .menu-btn{
    background: var(--surface-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding: 16px 10px;
    color: var(--text);
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size: 14px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    transition: transform .12s ease, border-color .12s ease;
  }
  .menu-btn:hover{ border-color: var(--gold); transform: translateY(-2px); }
  .menu-btn .emoji{ font-size: 22px; }
  .full-btn{
    grid-column: 1 / -1;
  }
  .cat-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .cat-btn{
    border-radius:16px;
    padding: 14px 8px;
    border: none;
    color: #14152B;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size: 13px;
    cursor:pointer;
    text-align:center;
    line-height:1.3;
  }
  .question-text{
    font-family:'Sora', sans-serif;
    font-size: 19px;
    font-weight:700;
    line-height:1.4;
    margin: 6px 0 20px 0;
  }
  .cat-label{
    color: var(--muted);
    font-size: 13px;
    font-weight:600;
    margin-bottom:4px;
  }
  .answers{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top:auto;
  }
  .answer-btn{
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius:14px;
    padding: 14px 16px;
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size: 15px;
    text-align:left;
    cursor:pointer;
  }
  .answer-btn:hover{ border-color: var(--violet); }
  .answer-btn.correct{ background: rgba(51,214,166,.18); border-color: var(--teal); color: var(--teal); }
  .answer-btn.wrong{ background: rgba(255,92,114,.18); border-color: var(--coral); color: var(--coral); }
  .answer-btn:disabled{ cursor:default; }
  .result-box{
    text-align:center;
    padding: 20px 0;
  }
  .result-box .big{
    font-family:'Sora', sans-serif;
    font-size:22px;
    font-weight:800;
    margin-bottom: 8px;
  }
  .result-box.ok .big{ color: var(--teal); }
  .result-box.ko .big{ color: var(--coral); }
  .result-box p{ color: var(--muted); font-size:14px; }
  .btn{
    background: var(--gold);
    color: #14152B;
    border:none;
    border-radius:14px;
    padding: 14px;
    font-family:'Sora', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    width:100%;
  }
  .btn.ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }
  .btn-row{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:auto;
  }
  .profile-row{
    display:flex;
    justify-content:space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size:14px;
  }
  .profile-row span:first-child{ color: var(--muted); }
  .profile-row span:last-child{ font-weight:700; }
  .rank-item{
    display:flex;
    justify-content:space-between;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
    font-size:14px;
  }
  .rank-item .medal{ width:26px; display:inline-block; }
  .back-link{
    color: var(--muted);
    font-size: 13px;
    text-decoration:none;
    cursor:pointer;
    margin-bottom: 14px;
    display:inline-block;
  }

    text-align:center;
    margin:auto;
  }
  .center-msg .emoji-big{ font-size: 48px; margin-bottom: 12px; }
  .footer-note{
    text-align:center;
    color: var(--muted);
    font-size:12px;
    margin-top:14px;

  .credit{
    text-align:center;
    color: var(--muted);
    font-size:12px;
    margin-top:4px;
    font-family:'Sora', sans-serif;
    font-weight:600;
    letter-spacing:0.02em;

  .credit span{ color: var(--gold); }
  #install-btn{

    margin-top:10px;

</style>

/* ---------- Constantes ---------- */
const LIFE_MAX = 5;
const LIFE_RECOVERY_SECONDS = 2 * 60;
const STORAGE_KEY = "quiz_challenge_profile_v1";

/* ---------- État / persistance ---------- */
function defaultProfile(){
  return {
    xp:0, coins:0, lives:LIFE_MAX, score:0,
    questions_played:0, correct_answers:0,
    current_streak:0, best_streak:0,
    last_life_at:0,
    answered: {},
    best_score_ever:0,
  };
}
function loadProfile(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultProfile();
    return Object.assign(defaultProfile(), JSON.parse(raw));
  }catch(e){ return defaultProfile(); }
}
function saveProfile(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(profile)); }

let profile = loadProfile();
let state = { screen: "home", category: null, currentQ: null, answered: false, lastCorrect: false };

function level(){ return Math.floor(profile.xp/100)+1; }

/* ---------- Récupération des vies ---------- */
function recoverLives(){
  const now = Math.floor(Date.now()/1000);
  if(profile.lives >= LIFE_MAX){ profile.last_life_at = 0; return; }
  if(profile.last_life_at <= 0){ profile.last_life_at = now; return; }
  const elapsed = now - profile.last_life_at;
  const recovered = Math.min(LIFE_MAX - profile.lives, Math.floor(elapsed / LIFE_RECOVERY_SECONDS));
  if(recovered > 0){
    profile.lives += recovered;
    profile.last_life_at += recovered * LIFE_RECOVERY_SECONDS;
    if(profile.lives >= LIFE_MAX) profile.last_life_at = 0;
  }
}
function nextLifeIn(){
  if(profile.lives >= LIFE_MAX || profile.last_life_at === 0) return 0;
  const now = Math.floor(Date.now()/1000);
  return Math.max(0, LIFE_RECOVERY_SECONDS - (now - profile.last_life_at));
}
function formatCountdown(sec){
  sec = Math.max(0, Math.floor(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}min ${String(s).padStart(2,"0")}s`;
}

/* ---------- Génération question de calcul ---------- */
function createMathQuestion(){
  const ops = [["+",(a,b)=>a+b], ["−",(a,b)=>a-b], ["×",(a,b)=>a*b]];
  const [symbol, fn] = ops[Math.floor(Math.random()*ops.length)];
  let a = Math.floor(Math.random()*30)+1;
  let b = Math.floor(Math.random()*30)+1;
  if(symbol === "−" && b > a){ [a,b] = [b,a]; }
  const correct = fn(a,b);
  const optionsSet = new Set([correct]);
  while(optionsSet.size < 4){
    const delta = Math.floor(Math.random()*15)+1;
    const candidate = correct + (Math.random()<0.5 ? -delta : delta);
    if(candidate >= 0) optionsSet.add(candidate);
  }
  const options = Array.from(optionsSet).sort(()=>Math.random()-0.5);
  return {
    q: `Combien font ${a} ${symbol} ${b} ?`,
    options: options.map(String),
    correct: options.indexOf(correct),
  };
}

/* ---------- Sélection question ---------- */
function pickQuestion(category){
  if(category === "calcul") return createMathQuestion();

  let pool = category === "random"
    ? Object.keys(QUESTIONS).flatMap(c => QUESTIONS[c].map((q,i)=>({...q, cat:c, idx:i})))
    : QUESTIONS[category].map((q,i)=>({...q, cat:category, idx:i}));

  const answeredForCat = (c) => profile.answered[c] || [];
  let unanswered = pool.filter(item => !answeredForCat(item.cat).includes(item.idx));

  if(unanswered.length === 0){
    if(category === "random"){
      Object.keys(QUESTIONS).forEach(c => { profile.answered[c] = []; });
    } else {
      profile.answered[category] = [];
    }
    unanswered = pool;
  }
  return unanswered[Math.floor(Math.random()*unanswered.length)];
}

function startQuestion(category){
  recoverLives();
  saveProfile();
  if(profile.lives <= 0){
    state.screen = "gameover";
    state.category = category;
    render();
    return;
  }
  state.category = category;
  state.currentQ = pickQuestion(category);
  state.answered = false;
  state.screen = "question";
  render();
}

function renderQuestion(){
  const card = document.getElementById("card");
  const q = state.currentQ;
  const cat = state.category === "random" ? {label:"Mode aléatoire", emoji:"🎯"} : CATEGORIES[q.cat || state.category];
  card.innerHTML = `
    <a class="back-link" id="back-to-cats">⬅️ Changer de catégorie</a>
    <div class="cat-label">${cat.emoji} ${cat.label}</div>
    <div class="question-text">${q.q}</div>
    <div class="answers">
      ${q.options.map((opt,i)=>`<button class="answer-btn" data-i="${i}">${opt}</button>`).join("")}
    </div>
  `;
  document.getElementById("back-to-cats").onclick = ()=> go("categories");
  card.querySelectorAll(".answer-btn").forEach(btn=>{
    btn.onclick = ()=> answerQuestion(parseInt(btn.dataset.i));
  });
}

function answerQuestion(i){
  if(state.answered) return;
  state.answered = true;
  const q = state.currentQ;
  const correct = i === q.correct;
  state.lastCorrect = correct;
  const realCat = q.cat || state.category;

  if(!profile.answered[realCat]) profile.answered[realCat] = [];
  if(q.idx !== undefined && !profile.answered[realCat].includes(q.idx)){
    profile.answered[realCat].push(q.idx);
  }

  document.querySelectorAll(".answer-btn").forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx === q.correct) btn.classList.add("correct");
    else if(idx === i) btn.classList.add("wrong");
  });

  profile.questions_played += 1;

  if(correct){
    profile.xp += 10;
    profile.coins += 5;
    profile.score += 1;
    profile.correct_answers += 1;
    profile.current_streak += 1;
    profile.best_streak = Math.max(profile.best_streak, profile.current_streak);
    if(profile.score > profile.best_score_ever) profile.best_score_ever = profile.score;
  } else {
    profile.lives = Math.max(0, profile.lives - 1);
    profile.current_streak = 0;
    if(profile.lives < LIFE_MAX && profile.last_life_at === 0){
      profile.last_life_at = Math.floor(Date.now()/1000);
    }
  }
  saveProfile();
  renderTopbar();

  setTimeout(()=>{
    state.screen = (profile.lives <= 0 && !correct) ? "gameover" : "result";
    render();
  }, 900);
}

  const card = document.getElementById("card");
  card.innerHTML = `
    <a class="back-link" data-go="home">⬅️ Retour</a>
    <h3 style="margin-bottom:10px;">ℹ️ Aide</h3>
    <p style="color:var(--muted); font-size:14px; line-height:1.6;">
      🎮 Choisissez une catégorie et répondez aux questions.<br>
      ⭐ Une bonne réponse rapporte de l'XP.<br>
      🪙 Vous gagnez également des pièces.<br>
      ❤️ Une mauvaise réponse fait perdre une vie.<br>
      🏆 Votre score apparaît dans votre profil.<br><br>
      L'appli évite de reproposer une question déjà répondue jusqu'à épuisement de la catégorie.
    </p>
  `;
  card.querySelector("[data-go='home']").onclick = ()=> go("home");
}

function go(screen){
  state.screen = screen;
  render();
}

function render(){
  recoverLives();
  saveProfile();
  renderTopbar();
  if(state.screen === "home") renderHome();
  else if(state.screen === "categories") renderCategories();
  else if(state.screen === "question") renderQuestion();
  else if(state.screen === "result") renderResult();
  else if(state.screen === "gameover") renderGameOver();
  else if(state.screen === "profile") renderProfile();
  else if(state.screen === "ranking") renderRanking();
  else if(state.screen === "help") renderHelp();
}

render();

/* ---------- PWA : service worker + bouton d'installation ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  });
}
let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("install-btn").style.display = "block";
});
document.getElementById("install-btn").addEventListener("click", async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById("install-btn").style.display = "none";
});
window.addEventListener("appinstalled", ()=>{
  document.getElementById("install-btn").style.display = "none";
});
</script>
</body>
</html>
